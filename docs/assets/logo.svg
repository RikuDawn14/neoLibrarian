<svg width="480" height="120" viewBox="0 0 480 120"
     xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font: 600 36px monospace; fill: #f5f5f5; } /* light text */
    .tagline { font: 14px monospace; fill: #ccc; }        /* lighter gray */
    .icon { stroke: #f5f5f5; stroke-width: 3; fill: none; } /* light lines */
  </style>

  <!-- Book Icon -->
  <rect x="20" y="20" width="40" height="70" rx="4" class="icon"/>
  <line x1="30" y1="20" x2="30" y2="90" class="icon"/>

  <!-- Terminal Prompt -->
  <text x="26" y="65" font-family="monospace" font-size="18" fill="#f5f5f5">&gt;_</text>

  <!-- Text -->
  <text x="80" y="55" class="title">openLibrarian</text>
  <text x="80" y="80" class="tagline">
    Bring order to your media library
  </text>
</svg>
